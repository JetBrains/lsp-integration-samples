name: Build Modular Lua LSP plugin

on:
  push:
    paths:
      - 'plugins/lua-lsp-support-modular/**'
      - '.github/workflows/build-lua-modular-plugin.yml'
  pull_request:
    paths:
      - 'plugins/lua-lsp-support-modular/**'
      - '.github/workflows/build-lua-modular-plugin.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out sources
        uses: actions/checkout@v5

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Build plugin variants
        working-directory: plugins/lua-lsp-support-modular
        run: ./gradlew buildPluginVariants --no-daemon

      - name: Upload Linux ARM64 plugin
        uses: actions/upload-artifact@v5
        with:
          name: lua-lsp-modular-linux-arm64
          path: plugins/lua-lsp-support-modular/build/distributions/*-linux-arm64.zip
          if-no-files-found: error

      - name: Upload Linux x86_64 plugin
        uses: actions/upload-artifact@v5
        with:
          name: lua-lsp-modular-linux-x86_64
          path: plugins/lua-lsp-support-modular/build/distributions/*-linux-x86_64.zip
          if-no-files-found: error

      - name: Upload macOS ARM64 plugin
        uses: actions/upload-artifact@v5
        with:
          name: lua-lsp-modular-mac-arm64
          path: plugins/lua-lsp-support-modular/build/distributions/*-mac-arm64.zip
          if-no-files-found: error

      - name: Upload macOS x86_64 plugin
        uses: actions/upload-artifact@v5
        with:
          name: lua-lsp-modular-mac-x86_64
          path: plugins/lua-lsp-support-modular/build/distributions/*-mac-x86_64.zip
          if-no-files-found: error

      - name: Upload Windows x86_64 plugin
        uses: actions/upload-artifact@v5
        with:
          name: lua-lsp-modular-windows-x86_64
          path: plugins/lua-lsp-support-modular/build/distributions/*-windows-x86_64.zip
          if-no-files-found: error
